<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ResumeIQ - AI career intelligence: resume analysis, job matching, skill gaps, learning roadmaps and interview prep.">
  <title>{% block title %}{{ title or "ResumeIQ" }}{% endblock %} · ResumeIQ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EIQ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  {% for sheet in ["tokens", "base", "components", "layout", "pages"] %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/' ~ sheet ~ '.css') }}?v={{ app_version }}">
  {% endfor %}
  {% block head %}{% endblock %}
  <script src="{{ url_for('static', filename='js/core/theme-init.js') }}?v={{ app_version }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include "partials/sprite.html" %}
  {% block body %}{% endblock %}
  <div id="toasts" class="toasts" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
