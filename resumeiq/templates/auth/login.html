{% extends "auth/layout.html" %}
{% block title %}Sign in{% endblock %}
{% block card %}
<h2>Welcome back</h2>
<p>Sign in to continue to your career dashboard.</p>
<form id="login-form" novalidate>
  <div id="form-msg" class="form-msg" hidden role="alert"></div>
  <div class="field">
    <label for="email">Email</label>
    <input class="input" id="email" name="email" type="email" autocomplete="email" required>
    <span class="field-error"></span>
  </div>
  <div class="field">
    <div class="flex between"><label for="password">Password</label><a class="small" href="/forgot-password">Forgot password?</a></div>
    <div class="input-group">
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="btn btn-ghost btn-icon btn-sm input-addon" data-toggle-password="password" aria-label="Show password">{{ icon('eye') }}</button>
    </div>
    <span class="field-error"></span>
  </div>
  <label class="checkbox"><input type="checkbox" name="remember_me"> Remember me for 30 days</label>
  <button class="btn btn-grad btn-block" type="submit">Sign in {{ icon('arrow') }}</button>
</form>
<p class="auth-switch">New to ResumeIQ? <a href="/register">Create an account</a></p>
{% endblock %}
